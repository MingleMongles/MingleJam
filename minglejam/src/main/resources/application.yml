spring:
  application:
    name: minglejam

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    database: postgresql
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

mybatis:
  mapper-locations: classpath:/mappers/**/*.xml
